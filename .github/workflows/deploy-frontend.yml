name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pharmacy-frontend/package-lock.json

      - name: Install dependencies
        working-directory: pharmacy-frontend
        run: npm ci

      - name: Build Vite app
        working-directory: pharmacy-frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://pharmacy-backend-t0oi.onrender.com' }}
        run: npm run build

      - name: Verify dist/index.html exists
        run: |
          if [ ! -f pharmacy-frontend/dist/index.html ]; then
            echo "ERROR: dist/index.html not found. Build may have failed."
            exit 1
          fi
          echo "Build verified: dist/index.html exists."
          ls -la pharmacy-frontend/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: Deploy ONLY the built dist folder, NOT the repo root
          path: pharmacy-frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
