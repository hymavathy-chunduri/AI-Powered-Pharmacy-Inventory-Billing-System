spring.application.name=pharmacy-backend
server.port=${PORT:8080}

# PostgreSQL Connection Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pharmacy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${PGPASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Python ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5001/api/predictions}

# JPA & Hibernate Settings (Preserve existing schema without auto-ddl modification)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable HTTP CORS support for local frontend development
