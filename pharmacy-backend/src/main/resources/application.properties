spring.application.name=pharmacy-backend
server.port=${PORT:8080}

# MongoDB Atlas Configuration
# Set MONGODB_URI as an environment variable — do NOT hardcode secrets here
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:pharmacy_db}

# Reverse proxy header support (Render, Heroku, AWS ELB)
server.forward-headers-strategy=framework

# Session Cookie Configuration for Cross-Origin Production (GitHub Pages -> Render)
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true

# Python ML Service Configuration
ml.service.url=${ML_SERVICE_URL:http://localhost:5001/api/predictions}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://hymavathy-chunduri.github.io,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}

# Audit Database & Registration Configuration
mongodb.audit.database=${MONGODB_AUDIT_DATABASE:pharmacy_audit_db}
employee.registration.code=${EMPLOYEE_REGISTRATION_CODE:1234}
