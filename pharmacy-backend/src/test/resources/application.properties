spring.application.name=pharmacy-backend-test

# Embedded MongoDB for tests — Flapdoodle spring3x starts automatically on a random port
# No real MongoDB URI needed for unit/integration tests
spring.data.mongodb.database=pharmacy_test_db

# Flapdoodle embedded MongoDB version (REQUIRED for de.flapdoodle.embed.mongo.spring3x)
de.flapdoodle.mongodb.embedded.version=7.0.2

# Python ML Service (not called during unit tests)
ml.service.url=http://localhost:5001/api/predictions
