services:
  # Spring Boot Backend
  - type: web
    name: pharmacy-backend
    runtime: docker
    dockerfilePath: ./pharmacy-backend/Dockerfile
    dockerContext: ./pharmacy-backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: pharmacy_db
      - key: MONGODB_AUDIT_DATABASE
        value: pharmacy_audit_db
      - key: EMPLOYEE_REGISTRATION_CODE
        value: "1234"
      - key: CORS_ALLOWED_ORIGINS
        value: https://hymavathy-chunduri.github.io,http://localhost:3000,http://localhost:5173
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: pharmacy-ml
          property: host

  # Python ML Demand Prediction Service
  - type: web
    name: pharmacy-ml
    runtime: docker
    dockerfilePath: ./pharmacy-ml/Dockerfile
    dockerContext: ./pharmacy-ml
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: pharmacy_db
